<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体质信息录入</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Primary: Sage Green ===== */
  --xc-primary: #4E7A5C;
  --xc-primary-foreground: #FFFFFF;
  --xc-primary-50: #EEF5F0;
  --xc-primary-100: #D6E8DC;

  /* ===== Surfaces ===== */
  --xc-background: #F8FBF9;
  --xc-surface: #FFFFFF;
  --xc-surface-2: #F1F5F2;

  /* ===== Text ===== */
  --xc-foreground: #1A2620;
  --xc-muted-foreground: #5C7064;
  --xc-placeholder: #9AACA0;

  /* ===== Lines & Borders ===== */
  --xc-border: #DEE6E0;
  --xc-input: #DEE6E0;
  --xc-ring: #4E7A5C;
  --xc-divider: rgba(26, 38, 32, 0.06);

  /* ===== Status / Accent ===== */
  --xc-state-accent: #C5733A;
  --xc-state-accent-foreground: #FFFFFF;
  --xc-state-success: #22C55E;
  --xc-state-warning: #F59E0B;
  --xc-state-error: #EF4444;

  /* ===== Radius ===== */
  --xc-radius-xs: 4px;
  --xc-radius-sm: 8px;
  --xc-radius-md: 12px;
  --xc-radius-lg: 16px;
  --xc-radius-pill: 999px;

  /* ===== Shadows ===== */
  --xc-shadow-1: 0 1px 2px rgba(26, 38, 32, 0.05), 0 1px 1px rgba(26, 38, 32, 0.03);
  --xc-shadow-2: 0 8px 24px -8px rgba(26, 38, 32, 0.05);
  --xc-shadow-3: 0 24px 60px -20px rgba(26, 38, 32, 0.05);

  /* ===== Typography ===== */
  --xc-font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xc-font-mono: "SF Mono", "Menlo", monospace;

  /* ===== Semantic Aliases ===== */
  --xc-card: var(--xc-surface);
  --xc-card-foreground: var(--xc-foreground);
  --xc-popover: var(--xc-surface);
  --xc-popover-foreground: var(--xc-foreground);
  --xc-muted: var(--xc-surface-2);
  --xc-muted-foreground: var(--xc-muted-foreground);
}

/* Base typography */
body {
  font-family: var(--xc-font-sans);
  background-color: var(--xc-background);
  color: var(--xc-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--xc-background);
    --color-foreground: var(--xc-foreground);
    --color-card: var(--xc-card);
    --color-card-foreground: var(--xc-card-foreground);
    --color-popover: var(--xc-popover);
    --color-popover-foreground: var(--xc-popover-foreground);
    --color-primary: var(--xc-primary);
    --color-primary-foreground: var(--xc-primary-foreground);
    --color-muted: var(--xc-muted);
    --color-muted-foreground: var(--xc-muted-foreground);
    --color-border: var(--xc-border);
    --color-input: var(--xc-input);
    --color-ring: var(--xc-ring);
    --radius-sm: var(--xc-radius-sm);
    --radius-md: var(--xc-radius-md);
    --radius-lg: var(--xc-radius-lg);
  }
  @layer base {
    body { background: var(--xc-background); color: var(--xc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--xc-background); }
      .text-background { color: var(--xc-background); }
      .border-background { border-color: var(--xc-background); }
      .ring-background { --tw-ring-color: var(--xc-background); }
      .bg-foreground { background-color: var(--xc-foreground); }
      .text-foreground { color: var(--xc-foreground); }
      .border-foreground { border-color: var(--xc-foreground); }
      .ring-foreground { --tw-ring-color: var(--xc-foreground); }
      .bg-card { background-color: var(--xc-card); }
      .text-card { color: var(--xc-card); }
      .border-card { border-color: var(--xc-card); }
      .ring-card { --tw-ring-color: var(--xc-card); }
      .bg-card-foreground { background-color: var(--xc-card-foreground); }
      .text-card-foreground { color: var(--xc-card-foreground); }
      .border-card-foreground { border-color: var(--xc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--xc-card-foreground); }
      .bg-popover { background-color: var(--xc-popover); }
      .text-popover { color: var(--xc-popover); }
      .border-popover { border-color: var(--xc-popover); }
      .ring-popover { --tw-ring-color: var(--xc-popover); }
      .bg-popover-foreground { background-color: var(--xc-popover-foreground); }
      .text-popover-foreground { color: var(--xc-popover-foreground); }
      .border-popover-foreground { border-color: var(--xc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--xc-popover-foreground); }
      .bg-primary { background-color: var(--xc-primary); }
      .text-primary { color: var(--xc-primary); }
      .border-primary { border-color: var(--xc-primary); }
      .ring-primary { --tw-ring-color: var(--xc-primary); }
      .bg-primary-foreground { background-color: var(--xc-primary-foreground); }
      .text-primary-foreground { color: var(--xc-primary-foreground); }
      .border-primary-foreground { border-color: var(--xc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--xc-primary-foreground); }
      .bg-muted { background-color: var(--xc-muted); }
      .text-muted { color: var(--xc-muted); }
      .border-muted { border-color: var(--xc-muted); }
      .ring-muted { --tw-ring-color: var(--xc-muted); }
      .bg-muted-foreground { background-color: var(--xc-muted-foreground); }
      .text-muted-foreground { color: var(--xc-muted-foreground); }
      .border-muted-foreground { border-color: var(--xc-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--xc-muted-foreground); }
      .bg-border { background-color: var(--xc-border); }
      .text-border { color: var(--xc-border); }
      .border-border { border-color: var(--xc-border); }
      .ring-border { --tw-ring-color: var(--xc-border); }
      .bg-input { background-color: var(--xc-input); }
      .text-input { color: var(--xc-input); }
      .border-input { border-color: var(--xc-input); }
      .ring-input { --tw-ring-color: var(--xc-input); }
      .bg-ring { background-color: var(--xc-ring); }
      .text-ring { color: var(--xc-ring); }
      .border-ring { border-color: var(--xc-ring); }
      .ring-ring { --tw-ring-color: var(--xc-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Gender segmented control */
      .gender-radio:checked + .gender-option {
        background-color: var(--xc-primary);
        color: var(--xc-primary-foreground);
      }
      .gender-option:hover {
        background-color: var(--xc-primary-50);
      }
      /* Age range pills */
      .age-radio:checked + .age-pill {
        background-color: var(--xc-primary);
        color: var(--xc-primary-foreground);
        border-color: transparent;
      }
      .age-pill:hover {
        background-color: var(--xc-primary-50);
        border-color: var(--xc-primary-100);
      }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div class="critical-layout min-h-screen flex flex-col bg-background">
    <!-- 微信小程序导航栏 -->
    <header class="mini-program-nav sticky top-0 z-50 flex items-center justify-between px-4 h-11 bg-surface border-b border-border">
      <button class="flex items-center justify-center w-8 h-8 text-foreground" aria-label="返回">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>
      <h1 class="text-base font-semibold text-foreground">X教练</h1>
      <div class="flex items-center gap-1 w-16 h-7 px-2 rounded-full border border-border bg-surface-2">
        <button class="flex-1 flex items-center justify-center text-muted-foreground" aria-label="更多">
          <i data-lucide="more-horizontal" class="w-4 h-4"></i>
        </button>
        <span class="w-px h-4 bg-border"></span>
        <button class="flex-1 flex items-center justify-center text-muted-foreground" aria-label="关闭">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- 教练提示 -->
    <main class="flex-1 flex flex-col">
      <section id="coach-prompt" class="flex items-start gap-3 px-4 py-5">
        <div class="shrink-0 w-10 h-10 rounded-full bg-primary flex items-center justify-center text-primary-foreground font-semibold text-sm">
          X
        </div>
        <div class="max-w-[78%] px-4 py-3 rounded-2xl rounded-tl-md bg-surface shadow-1 text-foreground text-[15px] leading-relaxed">
          先填一下基本身体信息，我帮你算预算。
        </div>
      </section>

      <!-- 录入 Sheet -->
      <section id="weight-sheet" class="mt-auto bg-surface rounded-t-[16px] shadow-3 px-5 pt-3 pb-8">
        <!-- 把手 -->
        <div class="flex justify-center mb-5">
          <div class="w-10 h-1 rounded-full bg-border"></div>
        </div>

        <form class="flex flex-col gap-4" onsubmit="return false;">
          <!-- Gender -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-foreground">性别</label>
            <div class="flex rounded-lg overflow-hidden" role="radiogroup" aria-label="性别">
              <input type="radio" name="gender" id="gender-male" value="male" checked class="sr-only gender-radio">
              <label for="gender-male" class="gender-option flex-1 h-10 flex items-center justify-center text-sm font-medium cursor-pointer bg-[var(--xc-surface-2)] text-[var(--xc-foreground)] transition-colors">男</label>
              <input type="radio" name="gender" id="gender-female" value="female" class="sr-only gender-radio">
              <label for="gender-female" class="gender-option flex-1 h-10 flex items-center justify-center text-sm font-medium cursor-pointer bg-[var(--xc-surface-2)] text-[var(--xc-foreground)] transition-colors">女</label>
            </div>
          </div>

          <!-- Age Range -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-foreground">年龄段</label>
            <div class="flex gap-2 overflow-x-auto no-scrollbar" role="radiogroup" aria-label="年龄段">
              <input type="radio" name="age-range" id="age-18-24" value="18-24" class="sr-only age-radio">
              <label for="age-18-24" class="age-pill shrink-0 h-9 px-3.5 flex items-center justify-center text-sm rounded-full border border-[var(--xc-border)] bg-[var(--xc-surface)] text-[var(--xc-foreground)] cursor-pointer transition-colors">18-24</label>
              <input type="radio" name="age-range" id="age-25-34" value="25-34" checked class="sr-only age-radio">
              <label for="age-25-34" class="age-pill shrink-0 h-9 px-3.5 flex items-center justify-center text-sm rounded-full border border-[var(--xc-border)] bg-[var(--xc-surface)] text-[var(--xc-foreground)] cursor-pointer transition-colors">25-34</label>
              <input type="radio" name="age-range" id="age-35-44" value="35-44" class="sr-only age-radio">
              <label for="age-35-44" class="age-pill shrink-0 h-9 px-3.5 flex items-center justify-center text-sm rounded-full border border-[var(--xc-border)] bg-[var(--xc-surface)] text-[var(--xc-foreground)] cursor-pointer transition-colors">35-44</label>
              <input type="radio" name="age-range" id="age-45-54" value="45-54" class="sr-only age-radio">
              <label for="age-45-54" class="age-pill shrink-0 h-9 px-3.5 flex items-center justify-center text-sm rounded-full border border-[var(--xc-border)] bg-[var(--xc-surface)] text-[var(--xc-foreground)] cursor-pointer transition-colors">45-54</label>
              <input type="radio" name="age-range" id="age-55-plus" value="55+" class="sr-only age-radio">
              <label for="age-55-plus" class="age-pill shrink-0 h-9 px-3.5 flex items-center justify-center text-sm rounded-full border border-[var(--xc-border)] bg-[var(--xc-surface)] text-[var(--xc-foreground)] cursor-pointer transition-colors">55+</label>
            </div>
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="current-weight" class="text-sm font-medium text-foreground">当前体重（kg）</label>
            <input
              id="current-weight"
              type="number"
              step="0.1"
              inputmode="decimal"
              placeholder="例如 67.5"
              class="h-12 px-4 rounded-lg border border-input bg-surface text-foreground placeholder:text-placeholder focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="target-weight" class="text-sm font-medium text-foreground">目标体重（kg）</label>
            <input
              id="target-weight"
              type="number"
              step="0.1"
              inputmode="decimal"
              placeholder="例如 55.0"
              class="h-12 px-4 rounded-lg border border-input bg-surface text-foreground placeholder:text-placeholder focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label for="height" class="text-sm font-medium text-foreground">身高（cm）</label>
            <input
              id="height"
              type="number"
              inputmode="numeric"
              placeholder="例如 165"
              class="h-12 px-4 rounded-lg border border-input bg-surface text-foreground placeholder:text-placeholder focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent"
            />
          </div>

          <div class="flex flex-col gap-3 mt-4 pt-2">
            <button type="submit" class="h-12 w-full rounded-lg bg-primary text-primary-foreground font-semibold text-[15px] flex items-center justify-center">
              保存
            </button>
            <button type="button" class="h-12 w-full rounded-lg border border-input bg-surface text-foreground font-medium text-[15px] flex items-center justify-center">
              取消
            </button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
