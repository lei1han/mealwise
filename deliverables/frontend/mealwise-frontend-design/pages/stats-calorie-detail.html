<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热量统计</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Primary: Sage Green ===== */
  --xc-primary: #4E7A5C;
  --xc-primary-foreground: #FFFFFF;
  --xc-primary-50: #EEF5F0;
  --xc-primary-100: #D6E8DC;

  /* ===== Surfaces ===== */
  --xc-background: #F8FBF9;
  --xc-surface: #FFFFFF;
  --xc-surface-2: #F1F5F2;

  /* ===== Text ===== */
  --xc-foreground: #1A2620;
  --xc-muted-foreground: #5C7064;
  --xc-placeholder: #9AACA0;

  /* ===== Lines & Borders ===== */
  --xc-border: #DEE6E0;
  --xc-input: #DEE6E0;
  --xc-ring: #4E7A5C;
  --xc-divider: rgba(26, 38, 32, 0.06);

  /* ===== Status / Accent ===== */
  --xc-state-accent: #C5733A;
  --xc-state-accent-foreground: #FFFFFF;
  --xc-state-success: #22C55E;
  --xc-state-warning: #F59E0B;
  --xc-state-error: #EF4444;

  /* ===== Radius ===== */
  --xc-radius-xs: 4px;
  --xc-radius-sm: 8px;
  --xc-radius-md: 12px;
  --xc-radius-lg: 16px;
  --xc-radius-pill: 999px;

  /* ===== Shadows ===== */
  --xc-shadow-1: 0 1px 2px rgba(26, 38, 32, 0.05), 0 1px 1px rgba(26, 38, 32, 0.03);
  --xc-shadow-2: 0 8px 24px -8px rgba(26, 38, 32, 0.05);
  --xc-shadow-3: 0 24px 60px -20px rgba(26, 38, 32, 0.05);

  /* ===== Typography ===== */
  --xc-font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xc-font-mono: "SF Mono", "Menlo", monospace;

  /* ===== Semantic Aliases ===== */
  --xc-card: var(--xc-surface);
  --xc-card-foreground: var(--xc-foreground);
  --xc-popover: var(--xc-surface);
  --xc-popover-foreground: var(--xc-foreground);
  --xc-muted: var(--xc-surface-2);
  --xc-muted-foreground: var(--xc-muted-foreground);

  /* ===== v2 Chart & Stats Tokens ===== */
  --xc-chart-line: var(--xc-primary);
  --xc-chart-line-secondary: var(--xc-state-accent);
  --xc-chart-grid: var(--xc-border);
  --xc-progress-track: var(--xc-surface-2);
  --xc-progress-fill: var(--xc-primary);
  --xc-progress-ring-width: 6px;
  --xc-streak: #F59E0B;
  --xc-chart-height-sm: 160px;
  --xc-section-gap: 12px;
  --xc-card-padding: 16px;
  --xc-font-size-data-xl: 28px;
  --xc-font-size-data-lg: 22px;
  --xc-line-height-tight: 1.2;
}

/* Base typography */
body {
  font-family: var(--xc-font-sans);
  background-color: var(--xc-background);
  color: var(--xc-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--xc-background);
    --color-foreground: var(--xc-foreground);
    --color-card: var(--xc-card);
    --color-card-foreground: var(--xc-card-foreground);
    --color-popover: var(--xc-popover);
    --color-popover-foreground: var(--xc-popover-foreground);
    --color-primary: var(--xc-primary);
    --color-primary-foreground: var(--xc-primary-foreground);
    --color-muted: var(--xc-muted);
    --color-muted-foreground: var(--xc-muted-foreground);
    --color-border: var(--xc-border);
    --color-input: var(--xc-input);
    --color-ring: var(--xc-ring);
    --color-success: var(--xc-state-success);
    --color-accent: var(--xc-state-accent);
    --radius-sm: var(--xc-radius-sm);
    --radius-md: var(--xc-radius-md);
    --radius-lg: var(--xc-radius-lg);
  }
  @layer base {
    body { background: var(--xc-background); color: var(--xc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--xc-background); }
      .text-background { color: var(--xc-background); }
      .border-background { border-color: var(--xc-background); }
      .ring-background { --tw-ring-color: var(--xc-background); }
      .bg-foreground { background-color: var(--xc-foreground); }
      .text-foreground { color: var(--xc-foreground); }
      .border-foreground { border-color: var(--xc-foreground); }
      .ring-foreground { --tw-ring-color: var(--xc-foreground); }
      .bg-card { background-color: var(--xc-card); }
      .text-card { color: var(--xc-card); }
      .border-card { border-color: var(--xc-card); }
      .ring-card { --tw-ring-color: var(--xc-card); }
      .bg-card-foreground { background-color: var(--xc-card-foreground); }
      .text-card-foreground { color: var(--xc-card-foreground); }
      .border-card-foreground { border-color: var(--xc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--xc-card-foreground); }
      .bg-popover { background-color: var(--xc-popover); }
      .text-popover { color: var(--xc-popover); }
      .border-popover { border-color: var(--xc-popover); }
      .ring-popover { --tw-ring-color: var(--xc-popover); }
      .bg-popover-foreground { background-color: var(--xc-popover-foreground); }
      .text-popover-foreground { color: var(--xc-popover-foreground); }
      .border-popover-foreground { border-color: var(--xc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--xc-popover-foreground); }
      .bg-primary { background-color: var(--xc-primary); }
      .text-primary { color: var(--xc-primary); }
      .border-primary { border-color: var(--xc-primary); }
      .ring-primary { --tw-ring-color: var(--xc-primary); }
      .bg-primary-foreground { background-color: var(--xc-primary-foreground); }
      .text-primary-foreground { color: var(--xc-primary-foreground); }
      .border-primary-foreground { border-color: var(--xc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--xc-primary-foreground); }
      .bg-muted { background-color: var(--xc-muted); }
      .text-muted { color: var(--xc-muted); }
      .border-muted { border-color: var(--xc-muted); }
      .ring-muted { --tw-ring-color: var(--xc-muted); }
      .bg-muted-foreground { background-color: var(--xc-muted-foreground); }
      .text-muted-foreground { color: var(--xc-muted-foreground); }
      .border-muted-foreground { border-color: var(--xc-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--xc-muted-foreground); }
      .bg-border { background-color: var(--xc-border); }
      .text-border { color: var(--xc-border); }
      .border-border { border-color: var(--xc-border); }
      .ring-border { --tw-ring-color: var(--xc-border); }
      .bg-input { background-color: var(--xc-input); }
      .text-input { color: var(--xc-input); }
      .border-input { border-color: var(--xc-input); }
      .ring-input { --tw-ring-color: var(--xc-input); }
      .bg-ring { background-color: var(--xc-ring); }
      .text-ring { color: var(--xc-ring); }
      .border-ring { border-color: var(--xc-ring); }
      .ring-ring { --tw-ring-color: var(--xc-ring); }
      .bg-surface-2 { background-color: var(--xc-surface-2); }
      .text-surface-2 { color: var(--xc-surface-2); }
      .bg-state-accent { background-color: var(--xc-state-accent); }
      .text-state-accent { color: var(--xc-state-accent); }
      .bg-state-success { background-color: var(--xc-state-success); }
      .text-state-success { color: var(--xc-state-success); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- 自定义导航栏 -->
      <header class="sticky top-0 z-50 bg-background">
        <div class="pt-[env(safe-area-inset-top)]"></div>
        <div class="xc-nav flex items-center justify-between px-3">
          <button type="button" class="flex h-9 w-9 items-center justify-center rounded-full text-foreground hover:bg-muted" data-dom-id="nav-back-stats">
            <i data-lucide="chevron-left" class="h-5 w-5"></i>
          </button>
          <h1 class="text-[17px] font-semibold text-foreground">热量统计</h1>
          <div class="xc-capsule flex items-center rounded-full border border-border bg-card px-1">
            <button type="button" class="flex h-7 w-7 items-center justify-center rounded-full text-foreground hover:bg-muted">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-border"></span>
            <button type="button" class="flex h-7 w-7 items-center justify-center rounded-full text-foreground hover:bg-muted">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- 日期选择器 -->
      <section class="flex items-center justify-center mx-4 mt-3">
        <button type="button" class="xc-date-btn flex items-center justify-center rounded-full border border-border bg-card">
          <i data-lucide="chevron-left" class="h-4 w-4 text-foreground"></i>
        </button>
        <span class="xc-date-text mx-4 text-[15px] font-semibold text-foreground">8月28日 周四</span>
        <button type="button" class="xc-date-btn flex items-center justify-center rounded-full border border-border bg-card">
          <i data-lucide="chevron-right" class="h-4 w-4 text-foreground"></i>
        </button>
      </section>

      <!-- 当日热量圆环卡 -->
      <section class="xc-calorie-ring-card mx-4 mt-3 p-6">
        <div class="flex flex-col items-center">
          <!-- SVG 圆环图 -->
          <div class="relative" style="width: 140px; height: 140px;">
            <svg width="140" height="140" viewBox="0 0 140 140">
              <!-- 轨道 -->
              <circle cx="70" cy="70" r="60" fill="none" stroke="var(--xc-progress-track)" stroke-width="10" />
              <!-- 进度环 85% -->
              <!-- 周长 = 2 * PI * 60 = 376.99 -->
              <!-- 85% -> dashoffset = 376.99 * 0.15 = 56.55 -->
              <circle cx="70" cy="70" r="60" fill="none" stroke="var(--xc-progress-fill)" stroke-width="10"
                stroke-linecap="round"
                stroke-dasharray="376.99"
                stroke-dashoffset="56.55"
                transform="rotate(-90 70 70)" />
            </svg>
            <!-- 圆环中心文字 -->
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-[12px] text-muted-foreground">已摄入</span>
              <span class="text-[28px] font-bold text-primary leading-tight mt-0.5">1280</span>
              <span class="text-[12px] text-muted-foreground mt-0.5">kcal</span>
            </div>
          </div>

          <!-- 三列数据 -->
          <div class="mt-6 w-full flex items-center">
            <div class="flex-1 flex flex-col items-center">
              <span class="text-[12px] text-muted-foreground">预算</span>
              <span class="text-[14px] font-semibold text-foreground mt-1">1500 kcal</span>
            </div>
            <div class="w-px h-8 bg-border"></div>
            <div class="flex-1 flex flex-col items-center">
              <span class="text-[12px] text-muted-foreground">已摄入</span>
              <span class="text-[14px] font-semibold text-foreground mt-1">1280 kcal</span>
            </div>
            <div class="w-px h-8 bg-border"></div>
            <div class="flex-1 flex flex-col items-center">
              <span class="text-[12px] text-muted-foreground">剩余</span>
              <span class="text-[14px] font-semibold mt-1" style="color: var(--xc-state-success);">220 kcal</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 各餐明细 -->
      <section class="mx-4 mt-3">
        <h2 class="text-[15px] font-semibold text-foreground mb-2">今日饮食</h2>

        <!-- 早餐卡片 -->
        <div class="xc-meal-card p-3 mb-2" data-dom-id="nav-diet-detail-breakfast">
          <div class="flex items-center justify-between">
            <span class="text-[14px] font-semibold text-foreground">早餐</span>
            <span class="text-[12px] text-muted-foreground">07:30</span>
          </div>
          <p class="text-[13px] text-muted-foreground mt-1">半拳米饭 + 一拳青菜 + 半拳鸡蛋</p>
          <p class="text-[14px] font-semibold mt-2" style="color: var(--xc-state-accent);">约 280~350 大卡</p>
        </div>

        <!-- 午餐卡片 -->
        <div class="xc-meal-card p-3 mb-2" data-dom-id="nav-diet-detail-lunch">
          <div class="flex items-center justify-between">
            <span class="text-[14px] font-semibold text-foreground">午餐</span>
            <span class="text-[12px] text-muted-foreground">12:15</span>
          </div>
          <p class="text-[13px] text-muted-foreground mt-1">一拳牛肉饭 + 半拳蔬菜</p>
          <p class="text-[14px] font-semibold mt-2" style="color: var(--xc-state-accent);">约 450~550 大卡</p>
        </div>

        <!-- 晚餐卡片（空状态） -->
        <div class="xc-meal-card p-3 mb-2">
          <div class="flex items-center justify-between">
            <span class="text-[14px] font-semibold text-foreground">晚餐</span>
            <span class="text-[12px] text-muted-foreground">--</span>
          </div>
          <div class="flex items-center justify-between mt-2">
            <p class="text-[13px] text-muted-foreground">还没记录晚餐哦</p>
            <button class="xc-record-btn text-[12px] font-medium text-white" style="background-color: var(--xc-primary);">
              去记录
            </button>
          </div>
        </div>
      </section>

      <!-- 本周趋势 -->
      <section class="xc-weekly-trend-card mx-4 mt-3 mb-24 p-4">
        <h2 class="text-[15px] font-semibold text-foreground mb-3">本周趋势</h2>

        <!-- 柱状图 -->
        <div class="xc-bar-chart relative">
          <!-- 预算虚线 (1500 kcal 位置) -->
          <div class="xc-budget-line" style="top: 30px;"></div>
          <span class="xc-budget-label" style="top: 18px;">1500</span>

          <div class="flex items-end justify-between" style="height: 160px; padding-top: 28px;">
            <!-- 周一 -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] text-muted-foreground mb-1">1280</span>
              <div class="xc-bar xc-bar-past" style="height: 85px;"></div>
              <span class="xc-bar-label text-[11px] text-muted-foreground mt-1.5">一</span>
            </div>
            <!-- 周二 -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] text-muted-foreground mb-1">1350</span>
              <div class="xc-bar xc-bar-past" style="height: 95px;"></div>
              <span class="xc-bar-label text-[11px] text-muted-foreground mt-1.5">二</span>
            </div>
            <!-- 周三 -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] text-muted-foreground mb-1">1180</span>
              <div class="xc-bar xc-bar-past" style="height: 72px;"></div>
              <span class="xc-bar-label text-[11px] text-muted-foreground mt-1.5">三</span>
            </div>
            <!-- 周四 -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] text-muted-foreground mb-1">1420</span>
              <div class="xc-bar xc-bar-past" style="height: 104px;"></div>
              <span class="xc-bar-label text-[11px] text-muted-foreground mt-1.5">四</span>
            </div>
            <!-- 周五（今天） -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] font-semibold mb-1" style="color: var(--xc-primary);">1280</span>
              <div class="xc-bar xc-bar-today" style="height: 85px;"></div>
              <span class="xc-bar-label text-[11px] font-semibold mt-1.5" style="color: var(--xc-primary);">五</span>
            </div>
            <!-- 周六（未来） -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] text-transparent mb-1">--</span>
              <div class="xc-bar xc-bar-future" style="height: 60px;"></div>
              <span class="xc-bar-label text-[11px] text-muted-foreground mt-1.5">六</span>
            </div>
            <!-- 周日（未来） -->
            <div class="xc-bar-col flex flex-col items-center">
              <span class="xc-bar-value text-[12px] text-transparent mb-1">--</span>
              <div class="xc-bar xc-bar-future" style="height: 60px;"></div>
              <span class="xc-bar-label text-[11px] text-muted-foreground mt-1.5">日</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <style id="critical-layout">
      .xc-nav { height: 44px; }
      .xc-capsule { height: 32px; }

      /* 日期选择器按钮 */
      .xc-date-btn {
        width: 32px;
        height: 32px;
      }
      .xc-date-text {
        min-width: 100px;
        text-align: center;
      }

      /* 热量圆环卡片 */
      .xc-calorie-ring-card {
        background-color: var(--xc-surface);
        border-radius: var(--xc-radius-lg);
        box-shadow: var(--xc-shadow-1);
      }

      /* 各餐卡片 */
      .xc-meal-card {
        background-color: var(--xc-surface);
        border-radius: var(--xc-radius-md);
        box-shadow: var(--xc-shadow-1);
      }

      /* 去记录按钮 */
      .xc-record-btn {
        height: 28px;
        padding: 0 14px;
        border-radius: var(--xc-radius-pill);
      }

      /* 本周趋势卡片 */
      .xc-weekly-trend-card {
        background-color: var(--xc-surface);
        border-radius: var(--xc-radius-lg);
        box-shadow: var(--xc-shadow-1);
      }

      /* 柱状图 */
      .xc-bar-chart {
        position: relative;
      }
      .xc-bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .xc-bar {
        width: 24px;
        border-radius: var(--xc-radius-xs) var(--xc-radius-xs) 2px 2px;
      }
      .xc-bar-past {
        background-color: var(--xc-primary);
      }
      .xc-bar-today {
        background-color: var(--xc-primary);
        box-shadow: 0 0 0 2px var(--xc-state-accent);
      }
      .xc-bar-future {
        background-color: var(--xc-surface-2);
      }

      /* 预算虚线 */
      .xc-budget-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        border-top: 1px dashed var(--xc-state-accent);
        pointer-events: none;
        z-index: 1;
      }
      .xc-budget-label {
        position: absolute;
        right: 0;
        font-size: 10px;
        color: var(--xc-state-accent);
        pointer-events: none;
        z-index: 1;
      }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
