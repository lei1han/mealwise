<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体重趋势</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Primary: Mint Macaron ===== */
  --xc-primary: #7CB89E;
  --xc-primary-foreground: #FFFFFF;
  --xc-primary-50: #EDF6F2;
  --xc-primary-100: #D4EBE0;

  /* ===== Surfaces ===== */
  --xc-background: #F6FBF8;
  --xc-surface: #FFFFFF;
  --xc-surface-2: #EFF6F2;

  /* ===== Text ===== */
  --xc-foreground: #1A2822;
  --xc-muted-foreground: #5E7066;
  --xc-placeholder: #9AAFA2;

  /* ===== Lines & Borders ===== */
  --xc-border: #DCE6E0;
  --xc-input: #DCE6E0;
  --xc-ring: #7CB89E;
  --xc-divider: rgba(26, 40, 34, 0.06);

  /* ===== Status / Accent ===== */
  --xc-state-accent: #D4754A;
  --xc-state-accent-foreground: #FFFFFF;
  --xc-state-success: #22C55E;
  --xc-state-warning: #F59E0B;
  --xc-state-error: #EF4444;

  /* ===== Radius ===== */
  --xc-radius-xs: 4px;
  --xc-radius-sm: 8px;
  --xc-radius-md: 12px;
  --xc-radius-lg: 16px;
  --xc-radius-pill: 999px;

  /* ===== Shadows ===== */
  --xc-shadow-1: 0 1px 2px rgba(26, 40, 34, 0.04), 0 1px 1px rgba(26, 40, 34, 0.02);
  --xc-shadow-2: 0 8px 24px -8px rgba(26, 40, 34, 0.04);
  --xc-shadow-3: 0 24px 60px -20px rgba(26, 40, 34, 0.04);

  /* ===== Typography ===== */
  --xc-font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xc-font-mono: "SF Mono", "Menlo", monospace;

  /* ===== Semantic Aliases ===== */
  --xc-card: var(--xc-surface);
  --xc-card-foreground: var(--xc-foreground);
  --xc-popover: var(--xc-surface);
  --xc-popover-foreground: var(--xc-foreground);
  --xc-muted: var(--xc-surface-2);
  --xc-muted-foreground: var(--xc-muted-foreground);

  /* ===== v2 Chart & Stats Tokens ===== */
  --xc-chart-line: var(--xc-primary);
  --xc-chart-grid: var(--xc-border);
  --xc-chart-height-lg: 240px;
  --xc-progress-track: var(--xc-surface-2);
  --xc-progress-fill: var(--xc-primary);
  --xc-streak: #F59E0B;
  --xc-chart-height-sm: 160px;
  --xc-section-gap: 12px;
  --xc-card-padding: 16px;
  --xc-font-size-data-xl: 28px;
  --xc-font-size-data-lg: 22px;
  --xc-line-height-tight: 1.2;
  --xc-progress-ring-width: 6px;
}

/* Base typography */
body {
  font-family: var(--xc-font-sans);
  background-color: var(--xc-background);
  color: var(--xc-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--xc-background);
    --color-foreground: var(--xc-foreground);
    --color-card: var(--xc-card);
    --color-card-foreground: var(--xc-card-foreground);
    --color-popover: var(--xc-popover);
    --color-popover-foreground: var(--xc-popover-foreground);
    --color-primary: var(--xc-primary);
    --color-primary-foreground: var(--xc-primary-foreground);
    --color-muted: var(--xc-muted);
    --color-muted-foreground: var(--xc-muted-foreground);
    --color-border: var(--xc-border);
    --color-input: var(--xc-input);
    --color-ring: var(--xc-ring);
    --radius-sm: var(--xc-radius-sm);
    --radius-md: var(--xc-radius-md);
    --radius-lg: var(--xc-radius-lg);
  }
  @layer base {
    body { background: var(--xc-background); color: var(--xc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .border-background { border-color: var(--xc-background); }
      .ring-background { --tw-ring-color: var(--xc-background); }

      .text-foreground { color: var(--xc-foreground); }
      .border-foreground { border-color: var(--xc-foreground); }
      .ring-foreground { --tw-ring-color: var(--xc-foreground); }
      .bg-card { background-color: var(--xc-card); }
      .text-card { color: var(--xc-card); }
      .border-card { border-color: var(--xc-card); }
      .ring-card { --tw-ring-color: var(--xc-card); }
      .bg-card-foreground { background-color: var(--xc-card-foreground); }
      .text-card-foreground { color: var(--xc-card-foreground); }
      .border-card-foreground { border-color: var(--xc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--xc-card-foreground); }
      .bg-popover { background-color: var(--xc-popover); }
      .text-popover { color: var(--xc-popover); }
      .border-popover { border-color: var(--xc-popover); }
      .ring-popover { --tw-ring-color: var(--xc-popover); }
      .bg-popover-foreground { background-color: var(--xc-popover-foreground); }
      .text-popover-foreground { color: var(--xc-popover-foreground); }
      .border-popover-foreground { border-color: var(--xc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--xc-popover-foreground); }
      .bg-primary { background-color: var(--xc-primary); }
      .text-primary { color: var(--xc-primary); }
      .border-primary { border-color: var(--xc-primary); }
      .ring-primary { --tw-ring-color: var(--xc-primary); }
      .bg-primary-foreground { background-color: var(--xc-primary-foreground); }
      .text-primary-foreground { color: var(--xc-primary-foreground); }
      .border-primary-foreground { border-color: var(--xc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--xc-primary-foreground); }
      .bg-muted { background-color: var(--xc-muted); }
      .text-muted { color: var(--xc-muted); }
      .border-muted { border-color: var(--xc-muted); }
      .ring-muted { --tw-ring-color: var(--xc-muted); }
      .bg-muted-foreground { background-color: var(--xc-muted-foreground); }
      .text-muted-foreground { color: var(--xc-muted-foreground); }
      .border-muted-foreground { border-color: var(--xc-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--xc-muted-foreground); }
      .bg-border { background-color: var(--xc-border); }
      .text-border { color: var(--xc-border); }
      .border-border { border-color: var(--xc-border); }
      .ring-border { --tw-ring-color: var(--xc-border); }
      .bg-input { background-color: var(--xc-input); }
      .text-input { color: var(--xc-input); }
      .border-input { border-color: var(--xc-input); }
      .ring-input { --tw-ring-color: var(--xc-input); }
      .bg-ring { background-color: var(--xc-ring); }
      .text-ring { color: var(--xc-ring); }
      .border-ring { border-color: var(--xc-ring); }
      .ring-ring { --tw-ring-color: var(--xc-ring); }
      .text-state-success { color: var(--xc-state-success); }
      .text-state-accent { color: var(--xc-state-accent); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- 自定义导航栏 -->
      <header class="sticky top-0 z-50 border-b border-border bg-background">
        <div class="pt-[env(safe-area-inset-top)]"></div>
        <div class="xc-nav flex items-center justify-between px-3">
          <button type="button" class="xc-back-btn flex items-center justify-center rounded-full bg-card shadow-sm" data-dom-id="nav-back-stats">
            <i data-lucide="chevron-left" class="h-5 w-5 text-foreground"></i>
          </button>
          <h1 class="text-[17px] font-semibold text-foreground">体重趋势</h1>
          <div class="xc-capsule flex items-center rounded-full border border-border bg-card px-1">
            <button type="button" class="flex h-7 w-7 items-center justify-center rounded-full text-foreground hover:bg-muted">
              <i data-lucide="more-horizontal" class="h-4 w-4"></i>
            </button>
            <span class="h-4 w-px bg-border"></span>
            <button type="button" class="flex h-7 w-7 items-center justify-center rounded-full text-foreground hover:bg-muted">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- 时间维度切换 -->
      <section class="mx-4 mt-3">
        <div class="flex gap-2">
          <button class="xc-time-btn xc-time-btn-active flex-1 h-9 rounded-full text-[14px] font-medium">周</button>
          <button class="xc-time-btn xc-time-btn-inactive flex-1 h-9 rounded-full text-[14px] font-medium">月</button>
          <button class="xc-time-btn xc-time-btn-inactive flex-1 h-9 rounded-full text-[14px] font-medium">全部</button>
        </div>
      </section>

      <!-- 大尺寸折线图 -->
      <section class="xc-card-chart mx-4 mt-3 p-4">
        <div class="relative" style="height: var(--xc-chart-height-lg);">
          <svg width="100%" height="240" viewBox="0 0 311 240" preserveAspectRatio="none">
            <defs>
              <linearGradient id="weightGradientLg" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color: var(--xc-primary); stop-opacity: 0.08" />
                <stop offset="100%" style="stop-color: var(--xc-primary); stop-opacity: 0" />
              </linearGradient>
            </defs>

            <!-- Y 轴网格线 + 刻度标签 -->
            <!-- 66 -->
            <line x1="35" y1="20" x2="301" y2="20" stroke="var(--xc-chart-grid)" stroke-width="0.5" stroke-dasharray="3 3" />
            <text x="28" y="24" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="end">66</text>
            <!-- 64 -->
            <line x1="35" y1="54.5" x2="301" y2="54.5" stroke="var(--xc-chart-grid)" stroke-width="0.5" stroke-dasharray="3 3" />
            <text x="28" y="58.5" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="end">64</text>
            <!-- 62 -->
            <line x1="35" y1="89.1" x2="301" y2="89.1" stroke="var(--xc-chart-grid)" stroke-width="0.5" stroke-dasharray="3 3" />
            <text x="28" y="93.1" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="end">62</text>
            <!-- 60 -->
            <line x1="35" y1="123.6" x2="301" y2="123.6" stroke="var(--xc-chart-grid)" stroke-width="0.5" stroke-dasharray="3 3" />
            <text x="28" y="127.6" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="end">60</text>

            <!-- 目标体重虚线 55.0 kg -->
            <line x1="35" y1="163" x2="301" y2="163" stroke="var(--xc-state-accent)" stroke-width="1" stroke-dasharray="4 3" />
            <text x="295" y="158" font-size="10" fill="var(--xc-state-accent)" text-anchor="end">目标 55.0</text>

            <!-- 填充区域（平滑曲线下方） -->
            <!--
              数据点坐标（范围 55-66，y = 20 + (66-val)/11*143，有效高度143px，底部留77px给X轴和留白）
              重新计算：有效绘图高度从 y=20 到 y=163，共 143px
              66.0 -> 20
              65.0 -> 20 + 1/11*143 = 20 + 13 = 33
              64.3 -> 20 + 1.7/11*143 = 20 + 22.1 = 42.1
              63.8 -> 20 + 2.2/11*143 = 20 + 28.6 = 48.6
              63.2 -> 20 + 2.8/11*143 = 20 + 36.4 = 56.4
              62.5 -> 20 + 3.5/11*143 = 20 + 45.5 = 65.5
              62.0 -> 20 + 4/11*143 = 20 + 52 = 72
              61.8 -> 20 + 4.2/11*143 = 20 + 54.6 = 74.6
              55.0 -> 20 + 11/11*143 = 20 + 143 = 163

              X坐标：35 + day * (266/29)，30天，从第0天到第29天
              第0天(8/1): 35
              第5天(8/6): 35 + 5*9.17 = 80.85
              第10天(8/11): 35 + 10*9.17 = 126.7
              第15天(8/16): 35 + 15*9.17 = 172.55
              第20天(8/21): 35 + 20*9.17 = 218.4
              第25天(8/26): 35 + 25*9.17 = 264.25
              第29天(8/30): 35 + 29*9.17 = 300.93

              体重数据（模拟30天下降趋势，有波动）：
              第0天: 65.0 -> y=33
              第3天: 64.7 -> y=20+1.3/11*143=20+16.9=36.9
              第7天: 64.2 -> y=20+1.8/11*143=20+23.4=43.4
              第10天: 63.9 -> y=20+2.1/11*143=20+27.3=47.3
              第14天: 63.3 -> y=20+2.7/11*143=20+35.1=55.1
              第17天: 63.0 -> y=20+3/11*143=20+39=59
              第21天: 62.4 -> y=20+3.6/11*143=20+46.8=66.8
              第24天: 62.1 -> y=20+3.9/11*143=20+50.7=70.7
              第27天: 61.9 -> y=20+4.1/11*143=20+53.3=73.3
              第29天: 61.8 -> y=74.6
            -->
            <path d="M 35,33
                     Q 52.5,33 69.9,36.9
                     Q 87.3,40.8 106.5,43.4
                     Q 125.7,46 143.1,47.3
                     Q 160.5,48.6 179.7,55.1
                     Q 198.9,61.6 216.3,59
                     Q 233.7,56.4 252.9,66.8
                     Q 272.1,77.2 289.5,73.3
                     Q 306.9,69.4 301,74.6
                     L 301,180 L 35,180 Z"
                  fill="url(#weightGradientLg)" />

            <!-- 平滑折线 -->
            <path d="M 35,33
                     Q 52.5,33 69.9,36.9
                     Q 87.3,40.8 106.5,43.4
                     Q 125.7,46 143.1,47.3
                     Q 160.5,48.6 179.7,55.1
                     Q 198.9,61.6 216.3,59
                     Q 233.7,56.4 252.9,66.8
                     Q 272.1,77.2 289.5,73.3
                     Q 300,70.7 301,74.6"
                  fill="none"
                  stroke="var(--xc-chart-line)"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round" />

            <!-- 数据点（白底 + 主色边框，小圆圈） -->
            <circle cx="35" cy="33" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="69.9" cy="36.9" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="106.5" cy="43.4" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="143.1" cy="47.3" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="179.7" cy="55.1" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="216.3" cy="59" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="252.9" cy="66.8" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />
            <circle cx="289.5" cy="73.3" r="4" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="1.5" />

            <!-- 最后一个数据点（高亮，带 tooltip） -->
            <circle cx="301" cy="74.6" r="5" fill="var(--xc-surface)" stroke="var(--xc-primary)" stroke-width="2" />
            <circle cx="301" cy="74.6" r="2" fill="var(--xc-primary)" />

            <!-- X 轴底部日期标签 -->
            <text x="35" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/1</text>
            <text x="80.85" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/6</text>
            <text x="126.7" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/11</text>
            <text x="172.55" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/16</text>
            <text x="218.4" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/21</text>
            <text x="264.25" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/26</text>
            <text x="301" y="200" font-size="11" fill="var(--xc-muted-foreground)" text-anchor="middle">8/30</text>
          </svg>

          <!-- Tooltip 浮层（最后一个数据点） -->
          <div class="xc-tooltip absolute">
            <div class="xc-tooltip-weight text-[14px] font-semibold text-primary-foreground">61.8 kg</div>
            <div class="xc-tooltip-date text-[11px] text-primary-foreground/80">8月30日</div>
          </div>
        </div>
      </section>

      <!-- 统计信息卡 2x2 网格 -->
      <section class="xc-card-stats mx-4 mt-3 p-4">
        <div class="grid grid-cols-2 gap-4">
          <!-- 起始体重 -->
          <div class="flex flex-col">
            <span class="text-[13px] text-muted-foreground">起始体重</span>
            <span class="mt-1 text-[18px] font-semibold text-foreground">65.0 kg</span>
          </div>
          <!-- 当前体重 -->
          <div class="flex flex-col">
            <span class="text-[13px] text-muted-foreground">当前体重</span>
            <span class="mt-1 text-[18px] font-semibold text-primary">61.8 kg</span>
          </div>
          <!-- 最低体重 -->
          <div class="flex flex-col">
            <span class="text-[13px] text-muted-foreground">最低体重</span>
            <span class="mt-1 text-[18px] font-semibold text-foreground">61.5 kg</span>
          </div>
          <!-- 周均变化 -->
          <div class="flex flex-col">
            <span class="text-[13px] text-muted-foreground">周均变化</span>
            <span class="mt-1 text-[18px] font-semibold text-state-success">-0.8 kg/周</span>
          </div>
        </div>
      </section>

      <!-- 体重记录列表 -->
      <section class="xc-card-list mx-4 mt-3 mb-24">
        <div class="xc-list-header px-4 py-4">
          <h2 class="text-[15px] font-semibold text-foreground">体重记录</h2>
        </div>
        <div class="border-t border-border"></div>

        <!-- 列表项 1：最新 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月28日 周三</span>
          <span class="text-[15px] font-semibold text-primary">61.8 kg</span>
          <span class="text-[13px] text-state-success">↓ 0.2</span>
        </div>
        <div class="xc-list-divider"></div>

        <!-- 列表项 2 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月27日 周二</span>
          <span class="text-[15px] font-semibold text-foreground">62.0 kg</span>
          <span class="text-[13px] text-state-success">↓ 0.3</span>
        </div>
        <div class="xc-list-divider"></div>

        <!-- 列表项 3：缺报 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月26日 周一</span>
          <span class="text-[13px] text-muted-foreground">未上报</span>
        </div>
        <div class="xc-list-divider"></div>

        <!-- 列表项 4 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月25日 周日</span>
          <span class="text-[15px] font-semibold text-foreground">62.3 kg</span>
          <span class="text-[13px] text-state-success">↓ 0.1</span>
        </div>
        <div class="xc-list-divider"></div>

        <!-- 列表项 5 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月24日 周六</span>
          <span class="text-[15px] font-semibold text-foreground">62.4 kg</span>
          <span class="text-[13px]" style="color: var(--xc-state-warning);">↑ 0.2</span>
        </div>
        <div class="xc-list-divider"></div>

        <!-- 列表项 6 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月23日 周五</span>
          <span class="text-[15px] font-semibold text-foreground">62.2 kg</span>
          <span class="text-[13px] text-state-success">↓ 0.4</span>
        </div>
        <div class="xc-list-divider"></div>

        <!-- 列表项 7 -->
        <div class="xc-list-item px-4">
          <span class="text-[14px] text-foreground">8月22日 周四</span>
          <span class="text-[15px] font-semibold text-foreground">62.6 kg</span>
          <span class="text-[13px] text-state-success">↓ 0.2</span>
        </div>
      </section>

    </main>
    <style id="critical-layout">
      /* 导航栏 */
      .xc-nav { height: 44px; }
      .xc-back-btn {
        width: 36px;
        height: 36px;
      }
      .xc-capsule { height: 32px; }

      /* 卡片通用 */
      .xc-card-stats,
      .xc-card-chart,
      .xc-card-list {
        background-color: var(--xc-surface);
        border-radius: var(--xc-radius-lg);
        box-shadow: var(--xc-shadow-1);
      }

      /* 时间切换按钮 */
      .xc-time-btn-active {
        background-color: var(--xc-primary);
        color: var(--xc-primary-foreground);
      }
      .xc-time-btn-inactive {
        background-color: var(--xc-surface);
        color: var(--xc-muted-foreground);
        border: 1px solid var(--xc-border);
      }

      /* 图表 Tooltip */
      .xc-tooltip {
        top: 46px;
        right: 0;
        background-color: var(--xc-primary);
        border-radius: var(--xc-radius-sm);
        padding: 6px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      .xc-tooltip::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 4px solid var(--xc-primary);
      }

      /* 列表 */
      .xc-list-item {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .xc-list-item > span:nth-child(1) {
        flex: 1;
      }
      .xc-list-item > span:nth-child(2) {
        flex: 1;
        text-align: center;
      }
      .xc-list-item > span:nth-child(3) {
        flex: 1;
        text-align: right;
      }
      .xc-list-divider {
        height: 1px;
        background-color: var(--xc-border);
        margin-left: 16px;
      }
      .xc-card-list > .xc-list-divider:last-child,
      .xc-card-list > div:last-of-type {
        border-bottom: none;
      }
    </style>
