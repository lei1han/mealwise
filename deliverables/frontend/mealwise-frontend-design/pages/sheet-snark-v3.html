<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毒舌档位选择</title>
    <style id="theme-vars">
:root {
  /* ===== Brand Primary: Mint Macaron ===== */
  --xc-primary: #7CB89E;
  --xc-primary-foreground: #FFFFFF;
  --xc-primary-50: #EDF6F2;
  --xc-primary-100: #D4EBE0;

  /* ===== Surfaces ===== */
  --xc-background: #F6FBF8;
  --xc-surface: #FFFFFF;
  --xc-surface-2: #EFF6F2;

  /* ===== Text ===== */
  --xc-foreground: #1A2822;
  --xc-muted-foreground: #5E7066;
  --xc-placeholder: #9AAFA2;

  /* ===== Lines & Borders ===== */
  --xc-border: #DCE6E0;
  --xc-input: #DCE6E0;
  --xc-ring: #7CB89E;
  --xc-divider: rgba(26, 40, 34, 0.06);

  /* ===== Status / Accent ===== */
  --xc-state-accent: #D4754A;
  --xc-state-accent-foreground: #FFFFFF;
  --xc-state-success: #22C55E;
  --xc-state-warning: #F59E0B;
  --xc-state-error: #EF4444;

  /* ===== Radius ===== */
  --xc-radius-xs: 4px;
  --xc-radius-sm: 8px;
  --xc-radius-md: 12px;
  --xc-radius-lg: 16px;
  --xc-radius-pill: 999px;

  /* ===== Shadows ===== */
  --xc-shadow-1: 0 1px 2px rgba(26, 40, 34, 0.04), 0 1px 1px rgba(26, 40, 34, 0.02);
  --xc-shadow-2: 0 8px 24px -8px rgba(26, 40, 34, 0.04);
  --xc-shadow-3: 0 24px 60px -20px rgba(26, 40, 34, 0.04);

  /* ===== Typography ===== */
  --xc-font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --xc-font-mono: "SF Mono", "Menlo", monospace;

  /* ===== Semantic Aliases ===== */
  --xc-card: var(--xc-surface);
  --xc-card-foreground: var(--xc-foreground);
  --xc-popover: var(--xc-surface);
  --xc-popover-foreground: var(--xc-foreground);
  --xc-muted: var(--xc-surface-2);
  --xc-muted-foreground: var(--xc-muted-foreground);
}

/* Base typography */
body {
  font-family: var(--xc-font-sans);
  background-color: var(--xc-background);
  color: var(--xc-foreground);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--xc-background);
    --color-foreground: var(--xc-foreground);
    --color-card: var(--xc-card);
    --color-card-foreground: var(--xc-card-foreground);
    --color-popover: var(--xc-popover);
    --color-popover-foreground: var(--xc-popover-foreground);
    --color-primary: var(--xc-primary);
    --color-primary-foreground: var(--xc-primary-foreground);
    --color-muted: var(--xc-muted);
    --color-muted-foreground: var(--xc-muted-foreground);
    --color-border: var(--xc-border);
    --color-input: var(--xc-input);
    --color-ring: var(--xc-ring);
    --radius-sm: var(--xc-radius-sm);
    --radius-md: var(--xc-radius-md);
    --radius-lg: var(--xc-radius-lg);
  }
  @layer base {
    body { background: var(--xc-background); color: var(--xc-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--xc-background); }
      .text-background { color: var(--xc-background); }
      .border-background { border-color: var(--xc-background); }
      .ring-background { --tw-ring-color: var(--xc-background); }
      .bg-foreground { background-color: var(--xc-foreground); }
      .text-foreground { color: var(--xc-foreground); }
      .border-foreground { border-color: var(--xc-foreground); }
      .ring-foreground { --tw-ring-color: var(--xc-foreground); }
      .bg-card { background-color: var(--xc-card); }
      .text-card { color: var(--xc-card); }
      .border-card { border-color: var(--xc-card); }
      .ring-card { --tw-ring-color: var(--xc-card); }
      .bg-card-foreground { background-color: var(--xc-card-foreground); }
      .text-card-foreground { color: var(--xc-card-foreground); }
      .border-card-foreground { border-color: var(--xc-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--xc-card-foreground); }
      .bg-popover { background-color: var(--xc-popover); }
      .text-popover { color: var(--xc-popover); }
      .border-popover { border-color: var(--xc-popover); }
      .ring-popover { --tw-ring-color: var(--xc-popover); }
      .bg-popover-foreground { background-color: var(--xc-popover-foreground); }
      .text-popover-foreground { color: var(--xc-popover-foreground); }
      .border-popover-foreground { border-color: var(--xc-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--xc-popover-foreground); }
      .bg-primary { background-color: var(--xc-primary); }
      .text-primary { color: var(--xc-primary); }
      .border-primary { border-color: var(--xc-primary); }
      .ring-primary { --tw-ring-color: var(--xc-primary); }
      .bg-primary-foreground { background-color: var(--xc-primary-foreground); }
      .text-primary-foreground { color: var(--xc-primary-foreground); }
      .border-primary-foreground { border-color: var(--xc-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--xc-primary-foreground); }
      .bg-muted { background-color: var(--xc-muted); }
      .text-muted { color: var(--xc-muted); }
      .border-muted { border-color: var(--xc-muted); }
      .ring-muted { --tw-ring-color: var(--xc-muted); }
      .bg-muted-foreground { background-color: var(--xc-muted-foreground); }
      .text-muted-foreground { color: var(--xc-muted-foreground); }
      .border-muted-foreground { border-color: var(--xc-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--xc-muted-foreground); }
      .bg-border { background-color: var(--xc-border); }
      .text-border { color: var(--xc-border); }
      .border-border { border-color: var(--xc-border); }
      .ring-border { --tw-ring-color: var(--xc-border); }
      .bg-input { background-color: var(--xc-input); }
      .text-input { color: var(--xc-input); }
      .border-input { border-color: var(--xc-input); }
      .ring-input { --tw-ring-color: var(--xc-input); }
      .bg-ring { background-color: var(--xc-ring); }
      .text-ring { color: var(--xc-ring); }
      .border-ring { border-color: var(--xc-ring); }
      .ring-ring { --tw-ring-color: var(--xc-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen bg-background font-sans antialiased">
  <!-- 微信小程序导航栏 -->
  <header class="xc-nav-bar">
    <div class="xc-status-bar"></div>
    <div class="xc-nav-content">
      <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full text-foreground hover:bg-muted transition-colors" aria-label="返回">
        <i data-lucide="chevron-left" class="h-6 w-6"></i>
      </button>
      <h1 class="absolute left-1/2 -translate-x-1/2 text-base font-semibold text-foreground">三餐教练</h1>
      <div class="flex items-center gap-1.5 rounded-full border border-border bg-background/80 px-2 py-1">
        <button type="button" class="flex h-5 w-5 items-center justify-center text-muted-foreground hover:text-foreground transition-colors" aria-label="更多">
          <i data-lucide="more-horizontal" class="h-4 w-4"></i>
        </button>
        <span class="h-3 w-px bg-border"></span>
        <button type="button" class="flex h-5 w-5 items-center justify-center text-muted-foreground hover:text-foreground transition-colors" aria-label="关闭">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="xc-page">
    <section id="snark-sheet" class="xc-sheet flex min-h-[80vh] flex-col px-5 pb-8 pt-1">
      <!-- 顶部把手 -->
      <div class="xc-sheet-handle mx-auto mb-6"></div>

      <!-- Sheet 标题区 -->
      <div class="mb-6 text-center">
        <h2 class="text-xl font-semibold text-foreground">想让我怎么盯你？</h2>
        <p class="mt-1 text-sm text-muted-foreground">随时可以在设置里改。</p>
      </div>

      <!-- 选项列表 -->
      <div id="snark-options" class="flex-1 space-y-3">
        <!-- 温柔 -->
        <label class="group flex cursor-pointer items-center gap-4 rounded-xl border border-border bg-card p-4 transition-colors hover:border-primary/40">
          <span class="xc-radio transition-colors group-hover:border-primary/50">
            <i data-lucide="check" class="h-3.5 w-3.5 text-transparent"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium text-foreground">温柔</span>
            <span class="block text-sm text-muted-foreground">几乎不损，鼓励为主。</span>
          </span>
          <input type="radio" name="snark-level" value="gentle" class="sr-only">
        </label>

        <!-- 轻损（默认选中） -->
        <label class="xc-option-selected group flex cursor-pointer items-center gap-4 rounded-xl border-2 p-4 transition-colors">
          <span class="xc-radio xc-radio-selected transition-colors">
            <i data-lucide="check" class="h-3.5 w-3.5"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium text-foreground">轻损</span>
            <span class="block text-sm text-muted-foreground">损一句，马上给台阶。</span>
          </span>
          <input type="radio" name="snark-level" value="light" checked class="sr-only">
        </label>

        <!-- 辛辣 -->
        <label class="group flex cursor-pointer items-center gap-4 rounded-xl border border-border bg-card p-4 transition-colors hover:border-primary/40">
          <span class="xc-radio transition-colors group-hover:border-primary/50">
            <i data-lucide="check" class="h-3.5 w-3.5 text-transparent"></i>
          </span>
          <span class="flex-1">
            <span class="block text-base font-medium text-foreground">辛辣</span>
            <span class="block text-sm text-muted-foreground">损得狠一点，但我有分寸。</span>
          </span>
          <input type="radio" name="snark-level" value="spicy" class="sr-only">
        </label>
      </div>

      <!-- 底部主按钮 -->
      <div class="mt-6 pt-2">
        <button type="button" class="w-full rounded-xl py-3.5 text-center text-base font-semibold shadow-sm transition-transform active:scale-[0.99]" style="background-color: var(--xc-primary); color: var(--xc-primary-foreground);">就这个</button>
      </div>
    </section>
  </main>

  <script>lucide.createIcons();</script>

    <style id="critical-layout">
    /* Mini-program nav bar and bottom sheet critical layout */
    .xc-nav-bar { position: fixed; inset: 0 0 auto 0; z-index: 50; background: var(--xc-surface); }
    .xc-status-bar { height: 44px; }
    .xc-nav-content { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .xc-page { padding-top: 88px; min-height: 100vh; display: flex; flex-direction: column; }
    .xc-sheet { margin-top: auto; background: var(--xc-surface); border-radius: var(--xc-radius-lg) var(--xc-radius-lg) 0 0; box-shadow: var(--xc-shadow-3); }
    .xc-sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--xc-border); }
    .xc-radio { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; border: 2px solid var(--xc-border); flex-shrink: 0; }
    .xc-radio-selected { border-color: var(--xc-primary); background: var(--xc-primary); color: var(--xc-primary-foreground); }
    .xc-option-selected { border-color: var(--xc-primary); background: var(--xc-primary-50); }
  </style>
</body>
</html>
