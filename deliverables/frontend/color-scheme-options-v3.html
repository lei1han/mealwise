<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X教练 - 配色方案对比 (v3 马卡龙)</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #F5F5F0;
    color: #2C2C2C;
    padding: 40px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 8px; }
  .persona-tag {
    display: inline-block; font-size: 12px; font-weight: 500; color: #666;
    background: #EEECE8; padding: 3px 10px; border-radius: 6px; margin-bottom: 36px;
  }
  .persona-tag b { color: #444; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 24px;
  }

  .card {
    background: #FFF;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.06); }

  .card-header {
    padding: 24px 24px 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .card-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; opacity: .5; margin-bottom: 4px;
  }
  .card-name { font-size: 18px; font-weight: 700; }
  .card-desc { font-size: 13px; color: #888; margin-top: 2px; line-height: 1.4; }

  .swatches {
    display: flex; gap: 8px; padding: 0 24px 16px;
  }
  .swatch {
    flex: 1; height: 56px; border-radius: 10px;
    position: relative; cursor: default;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 6px;
  }
  .swatch span {
    font-size: 10px; font-weight: 600; letter-spacing: .3px;
    background: rgba(0,0,0,.15); color: #fff; padding: 2px 6px; border-radius: 4px;
  }
  .swatch.light span { background: rgba(0,0,0,.06); color: #555; }

  .preview {
    margin: 0 24px 24px; border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .chat-bubble {
    max-width: 80%; padding: 10px 14px; border-radius: 14px;
    font-size: 13px; line-height: 1.5;
  }
  .bubble-coach {
    align-self: flex-start; border-bottom-left-radius: 4px;
  }
  .bubble-user {
    align-self: flex-end; border-bottom-right-radius: 4px;
  }

  .calorie-tag {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600; margin-top: 4px;
  }

  .preview-actions {
    display: flex; gap: 8px; margin-top: 6px;
  }
  .btn-preview {
    padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    border: none; cursor: default;
  }
  .btn-preview.primary { color: #fff; }
  .btn-preview.secondary { background: transparent; border: 1.5px solid; }

  .trait-row {
    display: flex; gap: 6px; margin-top: 6px;
  }
  .trait {
    font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500;
    background: #F0F0F0; color: #777;
  }
</style>
</head>
<body>
<div class="container">
  <h1>X教练 · 配色方案 v3</h1>
  <p class="subtitle">马卡龙色系 · 柔软亲和，专业不甜腻</p>
  <div class="persona-tag">人格关键词：<b>专业</b> · <b>内心温暖</b> · <b>有点毒舌</b></div>

  <div class="grid" id="grid"></div>
</div>

<script>
const schemes = [
  {
    id: 1,
    name: '薄荷马卡龙',
    desc: '柔和薄荷绿，清新健康，像春天第一口呼吸。干净、有生命力、不甜腻。',
    traits: ['清新健康', '干净有度', '不甜腻'],
    primary: '#7CB89E',
    p50: '#EDF6F2',
    p100: '#D4EBE0',
    bg: '#F6FBF8',
    surface: '#FFFFFF',
    surface2: '#EFF6F2',
    fg: '#1A2822',
    muted: '#5E7066',
    accent: '#D4754A',
    border: '#DCE6E0',
  },
  {
    id: 2,
    name: '海盐马卡龙',
    desc: '低饱和蓝灰，像海盐味的马卡龙，冷静又温柔。沉静、可信赖、有书卷气。',
    traits: ['沉静温柔', '可信赖', '书卷气'],
    primary: '#7E9CB8',
    p50: '#EEF3F8',
    p100: '#D6E2EE',
    bg: '#F7F9FC',
    surface: '#FFFFFF',
    surface2: '#F0F4F8',
    fg: '#1A2430',
    muted: '#5C6A7A',
    accent: '#D4754A',
    border: '#DCE2EA',
  },
  {
    id: 3,
    name: '薰衣草马卡龙',
    desc: '柔和灰紫，保留薰衣草的温暖，但不幼稚。温柔、有安抚力、伙伴感强。',
    traits: ['温柔安抚', '伙伴感', '不幼稚'],
    primary: '#A08CB8',
    p50: '#F3EFF8',
    p100: '#E4DAEE',
    bg: '#F9F7FC',
    surface: '#FFFFFF',
    surface2: '#F3F0F8',
    fg: '#1E182E',
    muted: '#665E7A',
    accent: '#D4754A',
    border: '#E2DEEA',
  },
  {
    id: 4,
    name: '蜜桃马卡龙',
    desc: '柔和蜜桃粉橘，温暖但不甜，像一杯温热的桃子茶。亲切、有温度、让人放下防备。',
    traits: ['亲切温暖', '放下防备', '不甜腻'],
    primary: '#D4A08C',
    p50: '#FBF2EE',
    p100: '#F5E0D6',
    bg: '#FCF9F7',
    surface: '#FFFFFF',
    surface2: '#F8F2EE',
    fg: '#2A1E18',
    muted: '#7A6558',
    accent: '#C55A3A',
    border: '#EAE0D8',
  },
  {
    id: 5,
    name: '柠檬马卡龙',
    desc: '柔和黄油柠檬黄，明媚但不刺眼。积极、有活力、带一点幽默感。',
    traits: ['积极活力', '明媚不刺眼', '幽默感'],
    primary: '#B8A060',
    p50: '#F8F4EA',
    p100: '#EDE4CC',
    bg: '#FBFAF5',
    surface: '#FFFFFF',
    surface2: '#F5F2EA',
    fg: '#262218',
    muted: '#706858',
    accent: '#D4754A',
    border: '#E6E2D4',
  },
];

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = schemes.map((s, i) => `
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-label">方案 ${s.id}</div>
          <div class="card-name">${s.name}</div>
          <div class="card-desc">${s.desc}</div>
          <div class="trait-row">
            ${s.traits.map(t => `<span class="trait">${t}</span>`).join('')}
          </div>
        </div>
      </div>

      <div class="swatches">
        <div class="swatch" style="background:${s.primary}"><span>主色</span></div>
        <div class="swatch" style="background:${s.p50}"><span class="light">50</span></div>
        <div class="swatch" style="background:${s.p100}"><span class="light">100</span></div>
        <div class="swatch" style="background:${s.accent}"><span>强调</span></div>
        <div class="swatch" style="background:${s.bg}"><span class="light">背景</span></div>
      </div>

      <div class="preview" style="background:${s.bg};">
        <div class="chat-bubble bubble-coach" style="background:${s.surface};color:${s.fg};border:1px solid ${s.border};">
          早上好！今天称体重了吗？<br>
          <span style="color:${s.muted};font-size:11px;">08:32</span>
        </div>
        <div class="chat-bubble bubble-user" style="background:${s.primary};color:#fff;">
          称了，68.5，比昨天重了0.3 😅
        </div>
        <div class="chat-bubble bubble-coach" style="background:${s.surface};color:${s.fg};border:1px solid ${s.border};">
          正常波动，不用慌。记得中午好好吃饭，别报复性节食。
          <div class="calorie-tag" style="background:${s.accent};color:#fff;">今日预算剩余 1200 大卡</div>
        </div>
        <div class="preview-actions">
          <button class="btn-preview primary" style="background:${s.primary};">记录饮食</button>
          <button class="btn-preview secondary" style="color:${s.primary};border-color:${s.border};">聊聊心情</button>
        </div>
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
